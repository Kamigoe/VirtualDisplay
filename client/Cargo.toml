[package]
name = "vdview"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
pollster = "1.0.1"
sha2 = "0.11.1"
socket2 = "0.6.5"
wgpu = "30.0.1"
winit = "0.30.13"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

# Wayland: the keyboard-shortcuts-inhibit protocol (src/wlinhibit.rs) and the clipboard
# (src/clipwl.rs). winit already uses these crates; this only names them and turns on the protocol
# and the foreign-connection support.
[target.'cfg(target_os = "linux")'.dependencies]
# fcntl for the clipboard's pipes (src/clipwl.rs); winit already depends on it.
libc = "0.2.189"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }

[build-dependencies]
cc = "1.5.1"
